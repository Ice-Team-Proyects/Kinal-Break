# Optional Blueprint config for Render.
# For already-created Static Sites, also set this rewrite in the dashboard:
# Redirects/Rewrites → Source /* → Destination /index.html → Action Rewrite

services:
  - type: web
    name: kinal-break-client-admin
    runtime: static
    rootDir: client-admin
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kinal-break-client-customer
    runtime: static
    rootDir: client-customer
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
